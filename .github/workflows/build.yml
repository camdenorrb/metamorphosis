name: Build Addin

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit: 2026
            config: Release
          - revit: 2025
            config: Release2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build MetamorphosisCore (Revit ${{ matrix.revit }})
        run: dotnet build src/MetamorphosisCore/MetamorphosisCore.csproj -c ${{ matrix.config }}

      - name: Stage addin layout
        shell: pwsh
        run: |
          $out = "src/MetamorphosisCore/bin/Release${{ matrix.revit }}/net8.0-windows"
          New-Item -ItemType Directory -Path "artifact/Metamorphosis" -Force | Out-Null
          Copy-Item "$out/*" "artifact/Metamorphosis" -Recurse
          Copy-Item "src/MetaInstaller/MetamorphosisCore.addin" "artifact/"

      - name: Upload addin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metamorphosis-Revit${{ matrix.revit }}
          path: artifact/
          if-no-files-found: error
